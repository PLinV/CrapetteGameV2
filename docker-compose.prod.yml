# Production derrière un Traefik déjà installé sur le serveur (il gère le HTTPS).
# Lancement :  docker compose -f docker-compose.prod.yml up -d
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ni "ports" ni réseau Traefik : la base n'est joignable que par l'appli
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    # Image publiée (ex : monpseudo/crapette:1.0). Sans image publiée, "--build" la construit depuis le code.
    image: ${APP_IMAGE:-crapette:latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default # pour parler à la base
      - traefik # pour recevoir le trafic de Traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.crapette.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.crapette.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.crapette.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.crapette.loadbalancer.server.port=3000

networks:
  traefik:
    external: true # réseau créé par l'installation Traefik du serveur
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  pgdata:
