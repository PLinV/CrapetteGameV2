# Vérifie le code puis construit l'image Docker et la publie sur GitHub Container Registry (ghcr.io).
#  - push sur main      -> image :latest et :sha-xxxxxxx
#  - tag v1.2.3         -> image :1.2.3 et :1.2
#  - pull request       -> vérifications + build, sans publication
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Vérifications (TypeScript + ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npx tsc --noEmit

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npx tsc -b
          npx eslint .

  image:
    name: Image Docker
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pour publier sur ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Noms et tags de l'image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build (et publication hors pull request)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
